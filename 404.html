<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#17151f">
    <title>404 · Media PHPeitor</title>

    <link rel="stylesheet" href="./css/404.css?v=4">
</head>
<body>
    <main class="error-stage is-loading" data-error-code="404">
        <canvas id="rive-error" data-rive-src="./resources/404.riv?v=2" data-state-machine="State Machine 1" data-click-input="Click" data-reset-input="Reset" role="button" tabindex="0" aria-pressed="false" aria-label="Toca o pulsa Enter para animar al personaje 404"></canvas>
        <div id="rive-fallback" class="rive-fallback" hidden>
            <span class="fallback-code">404</span>
            <span>La página no está disponible</span>
        </div>
        <p class="error-status"><strong>404</strong><span>Página no encontrada</span></p>
       
        <a id="rive-home-hotspot" class="rive-home-hotspot" href="./index.html" aria-label="Volver al inicio"></a>
        <a id="rive-home-link" class="error-home-link" href="./index.html">
            <span aria-hidden="true">←</span> Volver al inicio
        </a>
    </main>
    <script defer src="https://unpkg.com/@rive-app/canvas@2.31.3"></script>
    <script defer src="./js/404.js?v=7"></script>

</html>
