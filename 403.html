<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#17151f">
    <title>403 · Media PHPeitor</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='75'>📷</text></svg>">
    <link rel="stylesheet" href="./css/404.css?v=3">
</head>
<body>
    <main class="error-stage is-loading" data-error-code="403">
        <canvas id="rive-error" data-rive-src="./resources/403.riv?v=3" data-rive-animations="Timeline 1,Timeline 2,Timeline 3" aria-label="Animación interactiva de acceso restringido"></canvas>
        <div id="rive-fallback" class="rive-fallback" hidden>
            <span class="fallback-code">403</span>
            <span>Acceso restringido</span>
        </div>
        <p class="error-status"><strong>403</strong><span>Acceso restringido</span></p>
        <nav class="error-controls" aria-label="Acciones de la página">
            <div class="error-triggers" aria-label="Cambiar animación">
                <button class="error-button error-button-ghost" type="button" data-rive-animation="Timeline 1" aria-label="Reproducir animación del gato">Gato</button>
                <button class="error-button error-button-ghost" type="button" data-rive-animation="Timeline 2" aria-label="Reproducir animación 404">404</button>
                <button class="error-button error-button-ghost" type="button" data-rive-animation="Timeline 3" aria-label="Reproducir animación del corazón">Corazón</button>
            </div>
            <a class="error-button error-button-primary" href="./index.html">Volver al inicio</a>
        </nav>
    </main>
    <script defer src="https://unpkg.com/@rive-app/canvas@2.31.3"></script>
    <script defer src="./js/404.js?v=5"></script>
</body>
</html>
